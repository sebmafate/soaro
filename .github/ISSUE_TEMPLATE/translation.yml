name: Translation fix
description: A text is wrong, unclear or too long in your language
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "Deutsch"
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Current text and suggested text
      description: You can also open a pull request, see CONTRIBUTING.md.
    validations:
      required: true
